[Hooks]
; Start in proxy-only mode. Enable one subsystem at a time after confirming that
; the game opens normally. Close the game before changing these values.
Window=0
D3D8=0
; Reserved. Vtable interception is disabled for this game because it corrupts
; ESP at IDirect3D8::CreateDevice. Setting these values to 1 has no effect.
D3D8CreateDevice=0
D3D8Device=0
DirectInput=0
Cursor=0

[Recovery]
; Experimental A/B fix. Keep disabled for passive diagnostics.
RestoreCursorClip=0
RestoreCursorClipDelayMs=250
WaitForDisplayChange=1
; Reserved for later experiments; currently have no effect.
UseSetCapture=0
ForceWindowActivation=0
ForceDirectInputAcquire=0
