[Recovery]
; Set to 0 for a passive A/B session that diagnoses ClipCursor without restoring it.
RestoreCursorClip=1
; Stabilization delay after focus/display recovery. Valid range: 1-10000 ms.
RestoreCursorClipDelayMs=250
; Wait for the pre-Alt-Tab display dimensions, with a two-second fallback.
WaitForDisplayChange=1
