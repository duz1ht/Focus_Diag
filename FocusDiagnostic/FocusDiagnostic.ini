[Recovery]
; Set to 0 for a passive A/B session that diagnoses ClipCursor without restoring it.
RestoreCursorClip=1
; Stabilization delay after focus/display recovery. Valid range: 1-10000 ms.
RestoreCursorClipDelayMs=250
; Wait for the pre-Alt-Tab display dimensions, with a two-second fallback.
WaitForDisplayChange=1
; Recheck at 500 ms, 2 s, and the end of this observation window.
RevalidateCursorClip=1
RevalidationWindowMs=5000
; Avoid an endless ClipCursor fight with an overlay or remote-display component.
MaxClipReapplications=3

[Diagnostics]
; Log ShowCursor, SetCursor, SetCursorPos and WM_SETCURSOR without changing them.
CursorTelemetry=1
; Observe DirectInput mouse/keyboard acquisition and failed reads without forcing Acquire.
DirectInput=1
